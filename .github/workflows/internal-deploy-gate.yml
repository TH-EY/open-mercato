name: Internal Deploy Gate

on:
  push:
    branches:
      - develop

concurrency:
  group: internal-deploy-gate-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast-test:
    name: Fast test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack bootstrap
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install markitdown CLI
        run: python3 -m pip install --upgrade pip markitdown

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build:packages

      - name: Prepare generated modules
        run: yarn generate

      - name: Rebuild packages with generated files
        run: yarn build:packages

      - name: Check dependency version conflicts
        run: yarn check:dep-versions

      - name: Check i18n sync
        run: yarn tsx scripts/i18n-check-sync.ts

      - name: Checking types
        run: yarn typecheck

      - name: Test
        run: yarn test

  docker-app-build:
    name: Docker app build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build main app Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/arm64
          cache-from: type=gha,scope=deploy-aws
          cache-to: type=gha,mode=max,scope=deploy-aws
