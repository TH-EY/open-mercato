name: Deploy to AWS ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - production
  workflow_run:
    workflows: ["Internal Deploy Gate"]
    types: [completed]
    branches: [develop]

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    name: Prepare deployment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.finalize.outputs.should_deploy }}
      environment: ${{ steps.finalize.outputs.environment }}
      head_sha: ${{ steps.finalize.outputs.head_sha }}
      branch: ${{ steps.finalize.outputs.branch }}
      reason: ${{ steps.finalize.outputs.reason }}

    steps:
      - name: Decide deployment scope
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_BRANCH: ${{ github.ref_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "environment=${DISPATCH_ENV}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
            echo "branch=${DISPATCH_BRANCH}" >> "$GITHUB_OUTPUT"
            if [ "$DISPATCH_BRANCH" != "develop" ]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "reason=manual_dispatch_not_on_develop" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "environment=production" >> "$GITHUB_OUTPUT"
          echo "head_sha=${WORKFLOW_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${WORKFLOW_HEAD_BRANCH}" >> "$GITHUB_OUTPUT"

          if [ "$WORKFLOW_CONCLUSION" != "success" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=internal_gate_not_success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$WORKFLOW_HEAD_BRANCH" != "develop" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_run_not_on_develop" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=internal_gate_success" >> "$GITHUB_OUTPUT"

      - name: Check for stale develop SHA
        id: freshness
        if: steps.decide.outputs.should_deploy == 'true' && github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ steps.decide.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CURRENT_SHA=$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/develop | awk '{print $1}')
          if [ -z "$CURRENT_SHA" ]; then
            echo "Failed to resolve current develop SHA"
            exit 1
          fi

          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "is_stale=true" >> "$GITHUB_OUTPUT"
            echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_stale=false" >> "$GITHUB_OUTPUT"
          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Downgrade stale deployment to no-op
        if: steps.freshness.outputs.is_stale == 'true'
        run: |
          echo "Stale deployment detected; skipping deploy."
          echo "Triggered SHA: ${{ steps.decide.outputs.head_sha }}"
          echo "Current develop SHA: ${{ steps.freshness.outputs.current_sha }}"

      - name: Finalize deployment decision
        id: finalize
        env:
          INITIAL_SHOULD_DEPLOY: ${{ steps.decide.outputs.should_deploy }}
          INITIAL_REASON: ${{ steps.decide.outputs.reason }}
          ENVIRONMENT: ${{ steps.decide.outputs.environment }}
          HEAD_SHA: ${{ steps.decide.outputs.head_sha }}
          BRANCH: ${{ steps.decide.outputs.branch }}
          IS_STALE: ${{ steps.freshness.outputs.is_stale }}
        run: |
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          if [ "${INITIAL_SHOULD_DEPLOY}" != "true" ]; then
            echo "should_deploy=${INITIAL_SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"
            echo "reason=${INITIAL_REASON}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${IS_STALE}" = "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=stale_head_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=${INITIAL_REASON}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build image
    if: needs.prepare.outputs.should_deploy == 'true' && needs.prepare.result == 'success'
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: ${{ needs.prepare.outputs.environment }}
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ needs.prepare.outputs.head_sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "latest=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=deploy-aws
          cache-to: type=gha,mode=max,scope=deploy-aws

  deploy-web:
    name: Deploy web
    if: needs.prepare.outputs.should_deploy == 'true' && needs.build-image.result == 'success'
    needs: [prepare, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ needs.prepare.outputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current web task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_WEB_TASK_FAMILY }} \
            --query taskDefinition \
            > web-task-def.json

      - name: Update web task definition with new image
        id: web-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: web-task-def.json
          container-name: app
          image: ${{ needs.build-image.outputs.image }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_WEB_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: false

  deploy-worker:
    name: Deploy worker
    if: needs.prepare.outputs.should_deploy == 'true' && needs.build-image.result == 'success'
    needs: [prepare, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ needs.prepare.outputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_WORKER_TASK_FAMILY }} \
            --query taskDefinition \
            > worker-task-def.json

      - name: Update worker task definition with new image
        id: worker-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task-def.json
          container-name: worker
          image: ${{ needs.build-image.outputs.image }}

      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_WORKER_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: false

  verify-services:
    name: Verify services quickly
    if: needs.prepare.outputs.should_deploy == 'true' && needs.deploy-web.result == 'success' && needs.deploy-worker.result == 'success'
    needs: [prepare, deploy-web, deploy-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: ${{ needs.prepare.outputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait briefly for ECS services to settle
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_WEB_SERVICE_NAME: ${{ vars.ECS_WEB_SERVICE_NAME }}
          ECS_WORKER_SERVICE_NAME: ${{ vars.ECS_WORKER_SERVICE_NAME }}
        run: |
          set -euo pipefail

          if timeout 240 aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_WEB_SERVICE_NAME}" "${ECS_WORKER_SERVICE_NAME}"; then
            echo "Services reached stable state within 4 minutes."
            exit 0
          fi

          echo "Services did not reach stable state within 4 minutes."
          echo "Recent ECS service state:"
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_WEB_SERVICE_NAME}" "${ECS_WORKER_SERVICE_NAME}" \
            --query 'services[].{service:serviceName,status:status,desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments[].{status:status,rollout:rolloutState,taskDefinition:taskDefinition,running:runningCount,pending:pendingCount,desired:desiredCount},events:events[0:5].message}'
          exit 1

  post-deployment-status:
    name: Post deployment status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - prepare
      - build-image
      - deploy-web
      - deploy-worker
      - verify-services

    steps:
      - name: Report deployment result
        run: |
          if [ "${{ needs.prepare.outputs.should_deploy }}" != "true" ]; then
            echo "Deployment skipped: ${{ needs.prepare.outputs.reason }}"
            exit 0
          fi

          if [ "${{ needs.build-image.result }}" = "success" ] \
            && [ "${{ needs.deploy-web.result }}" = "success" ] \
            && [ "${{ needs.deploy-worker.result }}" = "success" ] \
            && [ "${{ needs.verify-services.result }}" = "success" ]; then
            echo "Deployment to ${{ needs.prepare.outputs.environment }} succeeded"
            echo "Image: ${{ needs.build-image.outputs.image }}"
            exit 0
          fi

          echo "Deployment to ${{ needs.prepare.outputs.environment }} failed"
          echo "Build image: ${{ needs.build-image.result }}"
          echo "Deploy web: ${{ needs.deploy-web.result }}"
          echo "Deploy worker: ${{ needs.deploy-worker.result }}"
          echo "Verify services: ${{ needs.verify-services.result }}"
          exit 1
