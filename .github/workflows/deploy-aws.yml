name: Deploy to AWS via CloudFormation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  STACK_NAME: openmercato

jobs:
  build-and-deploy:
    name: Build, Deploy & Smoke Test
    runs-on: ubuntu-24.04-arm
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Verify deployment branch
        if: github.ref_name != 'develop'
        run: |
          echo "ERROR: Production deploys must use the develop branch."
          echo "Current branch: ${{ github.ref_name }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy CloudFormation stack
        env:
          APP_IMAGE: ${{ steps.image.outputs.uri }}
          JWT_SECRET_ARN: ${{ vars.JWT_SECRET_ARN != '' && vars.JWT_SECRET_ARN || secrets.JWT_SECRET_ARN }}
          ENCRYPTION_KEY_ARN: ${{ vars.ENCRYPTION_KEY_ARN != '' && vars.ENCRYPTION_KEY_ARN || secrets.ENCRYPTION_KEY_ARN }}
          REDIS_PARAMETER_GROUP_NAME: ${{ vars.REDIS_PARAMETER_GROUP_NAME != '' && vars.REDIS_PARAMETER_GROUP_NAME || secrets.REDIS_PARAMETER_GROUP_NAME }}
          CFN_S3_BUCKET: ${{ vars.CFN_S3_BUCKET }}
          CFN_S3_PREFIX: ${{ vars.CFN_S3_PREFIX }}
        run: bash ./infra/cloudformation/deploy.sh deploy

      - name: Resolve stack outputs
        id: stack
        run: |
          APPLICATION_URL="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue | [0]" \
            --output text)"
          CLUSTER_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue | [0]" \
            --output text)"
          WEB_SERVICE_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='WebServiceName'].OutputValue | [0]" \
            --output text)"
          WORKER_SERVICE_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='WorkerServiceName'].OutputValue | [0]" \
            --output text)"

          test -n "${APPLICATION_URL}" && test "${APPLICATION_URL}" != "None"
          test -n "${CLUSTER_NAME}" && test "${CLUSTER_NAME}" != "None"
          test -n "${WEB_SERVICE_NAME}" && test "${WEB_SERVICE_NAME}" != "None"
          test -n "${WORKER_SERVICE_NAME}" && test "${WORKER_SERVICE_NAME}" != "None"

          echo "application_url=${APPLICATION_URL}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=${CLUSTER_NAME}" >> "$GITHUB_OUTPUT"
          echo "web_service_name=${WEB_SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "worker_service_name=${WORKER_SERVICE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.stack.outputs.cluster_name }}" \
            --services "${{ steps.stack.outputs.web_service_name }}" "${{ steps.stack.outputs.worker_service_name }}" \
            --region "${AWS_REGION}"

      - name: Run auth + dashboard smoke test
        env:
          BASE_URL: ${{ steps.stack.outputs.application_url }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_TENANT_ID: ${{ vars.SMOKE_TEST_TENANT_ID != '' && vars.SMOKE_TEST_TENANT_ID || secrets.SMOKE_TEST_TENANT_ID }}
        run: node ./scripts/smoke-auth-dashboard.mjs

      - name: Post deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment to ${{ github.event.inputs.environment }} succeeded"
            echo "Image: ${{ steps.image.outputs.uri }}"
            echo "Application URL: ${{ steps.stack.outputs.application_url }}"
          else
            echo "Deployment to ${{ github.event.inputs.environment }} failed"
            exit 1
          fi
