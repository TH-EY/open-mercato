name: Deploy to AWS ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - production
  workflow_run:
    workflows: ["CI for Develop&Main"]
    types: [completed]
    branches: [develop]

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

permissions:
  id-token: write
  contents: read

jobs:
  build-image:
    name: Build image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Verify deployment branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi

          if [ "$BRANCH" != "develop" ]; then
            echo "ERROR: Production deploys must use the develop branch."
            echo "Current branch: $BRANCH"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "latest=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=deploy-aws
          cache-to: type=gha,mode=max,scope=deploy-aws

  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
    needs: build-image

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current web task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_WEB_TASK_FAMILY }} \
            --query taskDefinition \
            > web-task-def.json

      - name: Update web task definition with new image
        id: web-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: web-task-def.json
          container-name: app
          image: ${{ needs.build-image.outputs.image }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_WEB_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          wait-for-minutes: 15

  deploy-worker:
    name: Deploy worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
    needs: build-image

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_WORKER_TASK_FAMILY }} \
            --query taskDefinition \
            > worker-task-def.json

      - name: Update worker task definition with new image
        id: worker-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task-def.json
          container-name: worker
          image: ${{ needs.build-image.outputs.image }}

      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_WORKER_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          wait-for-minutes: 15

  post-deployment-status:
    name: Post deployment status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-image
      - deploy-web
      - deploy-worker

    steps:
      - name: Report deployment result
        run: |
          if [ "${{ needs.build-image.result }}" = "success" ] \
            && [ "${{ needs.deploy-web.result }}" = "success" ] \
            && [ "${{ needs.deploy-worker.result }}" = "success" ]; then
            echo "Deployment to ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }} succeeded"
            echo "Image: ${{ needs.build-image.outputs.image }}"
          else
            echo "Deployment to ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }} failed"
            echo "Build image: ${{ needs.build-image.result }}"
            echo "Deploy web: ${{ needs.deploy-web.result }}"
            echo "Deploy worker: ${{ needs.deploy-worker.result }}"
            exit 1
          fi
