name: Provision Finoo demo

on:
  push:
    branches:
      - fork/finoo

concurrency:
  group: om-dokploy-host-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AWS_REGION: eu-west-2
  ECR_REPOSITORY_NAME: openmercato-app
  FINOO_SUPERADMIN_PASSWORD_SECRET_ID: openmercato-upstream-baseline-dokploy/finoo-demo/superadmin-password
  FINOO_ADMIN_PASSWORD_SECRET_ID: openmercato-upstream-baseline-dokploy/finoo-demo/admin-password
  FINOO_EMPLOYEE_PASSWORD_SECRET_ID: openmercato-upstream-baseline-dokploy/finoo-demo/employee-password

jobs:
  first-provision-admission:
    if: >-
      github.ref == 'refs/heads/fork/finoo' &&
      github.event_name == 'push' &&
      github.event.deleted == false
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      allowed: ${{ steps.admission.outputs.allowed }}
    steps:
      - name: Require exact first-provision marker
        id: admission
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          allowed=false
          if [[ "$HEAD_COMMIT_MESSAGE" == *'[finoo:first-provision]'* ]]; then
            allowed=true
          fi
          echo "allowed=${allowed}" >> "$GITHUB_OUTPUT"

  deploy-demo:
    needs: first-provision-admission
    if: >-
      github.ref == 'refs/heads/fork/finoo' &&
      github.event_name == 'push' &&
      github.event.deleted == false &&
      needs.first-provision-admission.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout exact Finoo revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prove Finoo first-provision admission before image mutation
        shell: bash
        env:
          DEPLOY_BRANCH: fork/finoo
          DEPLOY_COMMIT: ${{ github.sha }}
          FINOO_PREFLIGHT_ONLY: 'true'
        run: |
          set -euo pipefail
          bash infra/aws-upstream-baseline/finoo-demo-provision.sh

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Resolve immutable image URI
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          repository_url="$(aws ecr describe-repositories \
            --region "${AWS_REGION}" \
            --repository-names "${ECR_REPOSITORY_NAME}" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          echo "repository_url=${repository_url}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${repository_url}:finoo-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push exact Finoo image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CONTAINER_PORT=3000
          tags: |
            ${{ steps.ecr.outputs.image_uri }}
          cache-from: |
            type=gha,scope=finoo-demo-app
            type=registry,ref=${{ steps.ecr.outputs.repository_url }}:finoo-buildcache
          cache-to: |
            type=gha,mode=max,scope=finoo-demo-app
            type=registry,ref=${{ steps.ecr.outputs.repository_url }}:finoo-buildcache,mode=max,oci-mediatypes=true,image-manifest=true

      - name: Provision Finoo demo through SSM and ALB
        id: deploy
        shell: bash
        env:
          DEPLOY_BRANCH: fork/finoo
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_APP_IMAGE: ${{ steps.ecr.outputs.image_uri }}
          DEPLOY_APP_DIGEST: ${{ steps.build.outputs.digest }}
          FINOO_SUPERADMIN_PASSWORD_SECRET_ID: ${{ env.FINOO_SUPERADMIN_PASSWORD_SECRET_ID }}
          FINOO_ADMIN_PASSWORD_SECRET_ID: ${{ env.FINOO_ADMIN_PASSWORD_SECRET_ID }}
          FINOO_EMPLOYEE_PASSWORD_SECRET_ID: ${{ env.FINOO_EMPLOYEE_PASSWORD_SECRET_ID }}
        run: |
          set -euo pipefail
          bash infra/aws-upstream-baseline/finoo-demo-provision.sh | tee deploy.log
          grep -E '^finoo_(hostname|url|port|target_group_arn|commit|image_digest)=' deploy.log >> "$GITHUB_OUTPUT"

      - name: Public login-page smoke
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -fsS -o /dev/null -w '%{http_code}' https://finoo.om.they.dev/login)"
          [[ "$code" =~ ^(200|302|307)$ ]]

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "### Finoo demo first provision"
            echo "- Jira: THOM-83"
            echo "- URL: https://finoo.om.they.dev"
            echo "- Branch: \`fork/finoo\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image digest: \`${{ steps.build.outputs.digest || 'not-built' }}\`"
            echo "- Port: \`${{ steps.deploy.outputs.finoo_port || 'n/a' }}\`"
            echo "- Authenticated smoke: superadmin, admin, and employee checks execute on the host"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
