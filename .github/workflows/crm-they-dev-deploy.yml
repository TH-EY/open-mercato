name: Deploy crm.they.dev

on:
  push:
    branches:
      - fork/crm-they-dev
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: string
        default: fork/crm-they-dev
      deploy_mode:
        description: Deployment mode
        required: true
        type: choice
        default: full
        options:
          - full
          - config-restart

concurrency:
  group: crm-they-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  NAME_PREFIX: openmercato-crm-they-dev

jobs:
  build-and-deploy:
    name: Build and deploy CRM
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
        uses: docker/setup-buildx-action@v3

      - name: Resolve ECR repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
        id: ecr
        run: |
          REPOSITORY_URL="$(aws ecr describe-repositories \
            --region "${AWS_REGION}" \
            --repository-names "${NAME_PREFIX}-app" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          echo "repository_url=${REPOSITORY_URL}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${REPOSITORY_URL}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.image_uri }}
            ${{ steps.ecr.outputs.repository_url }}:latest
          cache-from: type=gha

      - name: Deploy over SSM
        env:
          APP_IMAGE: ${{ steps.ecr.outputs.image_uri }}
          BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'full' }}
        run: bash scripts/crm/deploy-crm-they-dev.sh

      - name: Smoke /login
        run: |
          for attempt in $(seq 1 40); do
            status="$(curl -sk -o /tmp/crm-login.html -w '%{http_code}' https://crm.they.dev/login || true)"
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "crm.they.dev/login returned $status"
              exit 0
            fi
            echo "Attempt $attempt: got $status; waiting..."
            sleep 15
          done
          cat /tmp/crm-login.html || true
          exit 1
