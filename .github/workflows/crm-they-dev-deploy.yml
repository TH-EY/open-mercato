name: Deploy crm.they.dev

on:
  push:
    branches:
      - fork/crm-they-dev
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: string
        default: fork/crm-they-dev
      deploy_mode:
        description: Deployment mode
        required: true
        type: choice
        default: full
        options:
          - full
          - config-restart

concurrency:
  group: crm-they-dev-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AWS_REGION: eu-west-2
  NAME_PREFIX: openmercato-crm-they-dev
  SSM_CLOUDWATCH_LOG_GROUP: /aws/ssm/openmercato-crm-they-dev/deploy

jobs:
  build-and-deploy:
    name: Build and deploy CRM
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
        uses: docker/setup-buildx-action@v4

      - name: Resolve ECR repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
        id: ecr
        run: |
          REPOSITORY_URL="$(aws ecr describe-repositories \
            --region "${AWS_REGION}" \
            --repository-names "${NAME_PREFIX}-app" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          echo "repository_url=${REPOSITORY_URL}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${REPOSITORY_URL}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.image_uri }}
            ${{ steps.ecr.outputs.repository_url }}:latest
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.ecr.outputs.repository_url }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ steps.ecr.outputs.repository_url }}:buildcache,mode=max,oci-mediatypes=true,image-manifest=true

      - name: Prepare SSM logging
        run: |
          aws logs create-log-group \
            --region "${AWS_REGION}" \
            --log-group-name "${SSM_CLOUDWATCH_LOG_GROUP}" 2>/dev/null || true
          aws logs put-retention-policy \
            --region "${AWS_REGION}" \
            --log-group-name "${SSM_CLOUDWATCH_LOG_GROUP}" \
            --retention-in-days 14 2>/dev/null || true

      - name: Preflight disk and Docker usage
        env:
          SSM_STEP_NAME: Preflight disk and Docker usage
          SSM_TIMEOUT_SECONDS: 180
        run: |
          bash scripts/crm/ssm-run-step.sh <<'SSM'
          minimum_available_gb=8
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          available_gb=$((available_kb / 1024 / 1024))

          echo "Root filesystem:"
          df -h /
          echo
          echo "Docker usage:"
          docker system df || true

          if ((available_gb < minimum_available_gb)); then
            echo "Only ${available_gb}GB available on /. Minimum required: ${minimum_available_gb}GB." >&2
            exit 1
          fi
          SSM

      - name: Safe Docker cleanup when disk is low
        env:
          SSM_STEP_NAME: Safe Docker cleanup when disk is low
          SSM_TIMEOUT_SECONDS: 600
        run: |
          bash scripts/crm/ssm-run-step.sh <<'SSM'
          cleanup_threshold_gb=12
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          available_gb=$((available_kb / 1024 / 1024))

          echo "Available before cleanup: ${available_gb}GB"
          if ((available_gb >= cleanup_threshold_gb)); then
            echo "Skipping cleanup; available disk is above ${cleanup_threshold_gb}GB."
            exit 0
          fi

          echo "Pruning unused Docker build cache and unused images. Volumes are left untouched."
          docker builder prune -af || true
          docker image prune -af || true

          echo "Available after cleanup:"
          df -h /
          docker system df || true
          SSM

      - name: Prepare checkout and runtime config
        env:
          APP_IMAGE: ${{ steps.ecr.outputs.image_uri }}
          BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'full' }}
          APP_URL: https://crm.they.dev
          APP_PORT: 3001
          SSM_STEP_NAME: Prepare checkout and runtime config
          SSM_TIMEOUT_SECONDS: 300
        run: |
          {
            printf 'branch=%q\n' "${BRANCH}"
            printf 'deploy_mode=%q\n' "${DEPLOY_MODE}"
            printf 'app_image=%q\n' "${APP_IMAGE}"
            printf 'app_url=%q\n' "${APP_URL}"
            printf 'app_port=%q\n' "${APP_PORT}"
            cat <<'SSM'
          aws_region="${AWS_REGION:-eu-west-2}"
          name_prefix="${NAME_PREFIX:-openmercato-crm-they-dev}"
          repo_url="https://github.com/TH-EY/open-mercato.git"
          workdir=/opt/openmercato-crm
          mkdir -p "${workdir}"

          secret_value() {
            aws secretsmanager get-secret-value --region "${aws_region}" --secret-id "$1" --query SecretString --output text
          }

          param_value() {
            aws ssm get-parameter --region "${aws_region}" --name "$1" --query Parameter.Value --output text
          }

          if [[ ! -d "${workdir}/.git" ]]; then
            if [[ "${deploy_mode}" == "config-restart" ]]; then
              echo "Config-only deploy requires an existing CRM checkout at ${workdir}" >&2
              exit 1
            fi
            rm -rf "${workdir}"
            git clone --branch "${branch}" --single-branch "${repo_url}" "${workdir}"
          elif [[ "${deploy_mode}" == "full" ]]; then
            git -C "${workdir}" remote set-url origin "${repo_url}"
            git -C "${workdir}" fetch origin "${branch}" --prune
            git -C "${workdir}" checkout -B "${branch}" "origin/${branch}"
            git -C "${workdir}" reset --hard "origin/${branch}"
            git -C "${workdir}" clean -fdx -e .env.crm
          fi

          if [[ "${deploy_mode}" == "config-restart" ]]; then
            existing_app_image="$(awk -F= '$1=="APP_IMAGE"{print substr($0, index($0, "=") + 1)}' "${workdir}/.env.crm" 2>/dev/null || true)"
            app_image="${app_image:-${existing_app_image}}"
          fi

          if [[ -z "${app_image}" ]]; then
            echo "APP_IMAGE is empty and no existing image could be resolved." >&2
            exit 1
          fi

          database_url="$(secret_value "${name_prefix}/database-url")"
          jwt_secret="$(secret_value "${name_prefix}/jwt-secret")"
          tenant_key="$(secret_value "${name_prefix}/tenant-data-encryption-key")"
          meili_key="$(secret_value "${name_prefix}/meilisearch-master-key")"
          admin_password="$(secret_value "${name_prefix}/initial-admin-password")"
          admin_email="$(param_value "/${name_prefix}/runtime/admin-email")"
          openrouter_api_key="$(secret_value "${name_prefix}/openrouter-api-key")"

          cat > "${workdir}/.env.crm" <<ENV_CRM
          APP_IMAGE=${app_image}
          APP_URL=${app_url}
          APP_PORT=${app_port}
          CONTAINER_PORT=3000
          DATABASE_URL=${database_url}
          JWT_SECRET=${jwt_secret}
          TENANT_DATA_ENCRYPTION_KEY=${tenant_key}
          MEILISEARCH_MASTER_KEY=${meili_key}
          OM_INIT_SUPERADMIN_EMAIL=${admin_email}
          OM_INIT_SUPERADMIN_PASSWORD=${admin_password}
          WEB_DB_POOL_MIN=0
          WEB_DB_POOL_MAX=12
          WORKER_DB_POOL_MIN=0
          WORKER_DB_POOL_MAX=4
          DB_POOL_IDLE_TIMEOUT=30000
          DB_POOL_ACQUIRE_TIMEOUT=60000
          DATA_SYNC_QUEUE_CONCURRENCY=1
          OPENROUTER_API_KEY=${openrouter_api_key}
          OM_AI_CUSTOMERS_PROVIDER=openrouter
          OM_AI_CUSTOMERS_MODEL=meta-llama/llama-3.3-70b-instruct
          OM_AI_CATALOG_PROVIDER=openrouter
          OM_AI_CATALOG_MODEL=meta-llama/llama-3.3-70b-instruct
          ENV_CRM

          echo "Prepared checkout:"
          git -C "${workdir}" rev-parse HEAD
          grep '^APP_IMAGE=' "${workdir}/.env.crm"
          SSM
          } | bash scripts/crm/ssm-run-step.sh

      - name: Pull Docker image
        env:
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'full' }}
          SSM_STEP_NAME: Pull Docker image
          SSM_TIMEOUT_SECONDS: 1200
        run: |
          {
            printf 'deploy_mode=%q\n' "${DEPLOY_MODE}"
            cat <<'SSM'
          workdir=/opt/openmercato-crm
          cd "${workdir}"
          app_image="$(awk -F= '$1=="APP_IMAGE"{print substr($0, index($0, "=") + 1)}' .env.crm)"

          if [[ "${deploy_mode}" == "config-restart" ]]; then
            echo "Config restart requested; verifying existing image instead of pulling."
            docker image inspect "${app_image}" --format '{{.Id}} {{.Created}}'
            exit 0
          fi

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          aws ecr get-login-password --region eu-west-2 \
            | docker login --username AWS --password-stdin "${account_id}.dkr.ecr.eu-west-2.amazonaws.com" >/dev/null
          timeout 900 docker pull "${app_image}"
          SSM
          } | bash scripts/crm/ssm-run-step.sh

      - name: Confirm local Docker image
        env:
          SSM_STEP_NAME: Confirm local Docker image
          SSM_TIMEOUT_SECONDS: 180
        run: |
          bash scripts/crm/ssm-run-step.sh <<'SSM'
          workdir=/opt/openmercato-crm
          app_image="$(awk -F= '$1=="APP_IMAGE"{print substr($0, index($0, "=") + 1)}' "${workdir}/.env.crm")"
          echo "Expected image: ${app_image}"
          docker image inspect "${app_image}" --format 'Image ID: {{.Id}}\nCreated: {{.Created}}\nRepo tags: {{json .RepoTags}}\nRepo digests: {{json .RepoDigests}}'
          SSM

      - name: Recreate app and worker
        env:
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'full' }}
          SSM_STEP_NAME: Recreate app and worker
          SSM_TIMEOUT_SECONDS: 600
        run: |
          {
            printf 'deploy_mode=%q\n' "${DEPLOY_MODE}"
            cat <<'SSM'
          cd /opt/openmercato-crm
          app_image="$(awk -F= '$1=="APP_IMAGE"{print substr($0, index($0, "=") + 1)}' .env.crm)"

          container_matches_image() {
            local container_name="$1"
            local inspected
            inspected="$(docker inspect \
              --format '{{.State.Running}} {{.Config.Image}}' \
              "${container_name}" 2>/dev/null || true)"
            [[ "${inspected}" == "true ${app_image}" ]]
          }

          if [[ "${deploy_mode}" != "config-restart" ]] \
            && container_matches_image openmercato-crm-app \
            && container_matches_image openmercato-crm-worker; then
            echo "App and worker already run ${app_image}; skipping recreate."
            docker ps --filter name=openmercato-crm --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            exit 0
          fi

          docker compose --env-file .env.crm -f docker-compose.crm.yml up -d --no-build --remove-orphans --force-recreate app worker
          docker ps --filter name=openmercato-crm --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          SSM
          } | bash scripts/crm/ssm-run-step.sh

      - name: Healthcheck local login
        env:
          SSM_STEP_NAME: Healthcheck local login
          SSM_TIMEOUT_SECONDS: 360
        run: |
          bash scripts/crm/ssm-run-step.sh <<'SSM'
          url="http://127.0.0.1:3001/login"
          for attempt in $(seq 1 60); do
            status="$(curl -fsS -o /tmp/openmercato-crm-login.html -w '%{http_code}' "${url}" 2>/dev/null || true)"
            if [[ "${status}" =~ ^[23] ]]; then
              echo "Local CRM login endpoint is reachable: ${url} (${status})"
              exit 0
            fi
            echo "Waiting for local CRM login endpoint (${attempt}/60): ${status:-no response}"
            sleep 5
          done
          cat /tmp/openmercato-crm-login.html 2>/dev/null || true
          echo "CRM app did not become reachable at ${url}" >&2
          exit 1
          SSM

      - name: Smoke /login
        id: public-smoke
        run: |
          last_status=000
          last_time_total=0
          for attempt in $(seq 1 40); do
            curl_output="$(curl -sk -o /tmp/crm-login.html -w '%{http_code} %{time_total}\n' https://crm.they.dev/login || true)"
            read -r status time_total <<< "${curl_output:-000 0}"
            status="${status:-000}"
            time_total="${time_total:-0}"
            last_status="${status}"
            last_time_total="${time_total}"
            if [[ "$status" =~ ^[0-9]{3}$ ]] && [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "status=${status}" >> "$GITHUB_OUTPUT"
              echo "time_total=${time_total}" >> "$GITHUB_OUTPUT"
              echo "crm.they.dev/login returned $status in ${time_total}s"
              exit 0
            fi
            echo "Attempt $attempt: got $status in ${time_total}s; waiting..."
            sleep 15
          done
          echo "status=${last_status}" >> "$GITHUB_OUTPUT"
          echo "time_total=${last_time_total}" >> "$GITHUB_OUTPUT"
          cat /tmp/crm-login.html || true
          exit 1

      - name: Deployment diagnostics
        if: always()
        env:
          SSM_STEP_NAME: Deployment diagnostics
          SSM_TIMEOUT_SECONDS: 240
        run: |
          bash scripts/crm/ssm-run-step.sh <<'SSM'
          set +e
          cd /opt/openmercato-crm 2>/dev/null || true
          echo "Checkout:"
          git rev-parse HEAD 2>/dev/null || true
          echo
          echo "Configured image:"
          grep '^APP_IMAGE=' .env.crm 2>/dev/null || true
          echo
          echo "Disk:"
          df -h / /var/lib/docker 2>/dev/null || true
          echo
          echo "Docker usage:"
          docker system df || true
          echo
          echo "Containers:"
          docker ps --filter name=openmercato-crm --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
          echo
          echo "App logs:"
          docker logs --tail 120 openmercato-crm-app 2>&1 || true
          echo
          echo "Worker logs:"
          docker logs --tail 120 openmercato-crm-worker 2>&1 || true
          exit 0
          SSM

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "### crm.they.dev deploy"
            echo "- URL: https://crm.they.dev"
            echo "- Branch: \`${{ github.event.inputs.branch || github.ref_name }}\`"
            echo "- Deploy mode: \`${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'full' }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`${{ steps.ecr.outputs.image_uri || 'unchanged config-restart image' }}\`"
            echo "- Build cache: GitHub Actions cache + ECR registry cache \`${{ steps.ecr.outputs.repository_url || 'n/a' }}:buildcache\`"
            echo "- Public smoke: \`${{ steps.public-smoke.outputs.status || 'not-run' }}\` in \`${{ steps.public-smoke.outputs.time_total || 'n/a' }}s\`"
            echo "- SSM logs: \`${SSM_CLOUDWATCH_LOG_GROUP}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
