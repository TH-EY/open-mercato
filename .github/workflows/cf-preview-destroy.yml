name: Destroy CloudFormation preview

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: contrib/* branch whose CloudFormation/ECS preview should be destroyed
        required: true
        type: string

concurrency:
  group: cf-preview-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.event.ref }}
  cancel-in-progress: false

jobs:
  destroy-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'contrib/'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-2
    steps:
      - name: Checkout develop tooling
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Resolve branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            BRANCH="${{ github.event.ref }}"
          fi
          if [[ "$BRANCH" == refs/heads/* ]]; then
            BRANCH="${BRANCH#refs/heads/}"
          fi
          if [[ "$BRANCH" != contrib/* ]]; then
            echo "Only contrib/* branches are supported" >&2
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy CloudFormation preview
        run: bash ./infra/cloudformation/preview-destroy.sh '${{ steps.branch.outputs.branch }}'
