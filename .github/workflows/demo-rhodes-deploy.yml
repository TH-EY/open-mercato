name: Deploy Rhodes demo

on:
  push:
    branches:
      - 'fork/demo-rhodes'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to rhodes.om.they.dev
        required: false
        default: fork/demo-rhodes
        type: string

concurrency:
  group: demo-rhodes
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  DEMO_NAME: rhodes
  DEMO_URL: https://rhodes.om.they.dev

jobs:
  deploy-rhodes:
    name: Build image and deploy Rhodes demo
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Resolve branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            BRANCH="${{ inputs.branch }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          if [[ "$BRANCH" != fork/demo-rhodes ]]; then
            echo "Rhodes demo deploys must use fork/demo-rhodes. Current branch: $BRANCH" >&2
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout Rhodes branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          IMAGE_TAG="rhodes-${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push Rhodes image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:rhodes-latest
          cache-from: type=gha,scope=rhodes-demo
          cache-to: type=gha,mode=max,scope=rhodes-demo

      - name: Deploy Rhodes demo on Dokploy host
        id: deploy
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
          DEMO_APP_IMAGE: ${{ steps.image.outputs.uri }}
          DEMO_DOCKER_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          DEMO_DOCKER_USERNAME: AWS
        run: |
          set -euo pipefail
          ECR_PASSWORD="$(aws ecr get-login-password --region "${AWS_REGION}")"
          echo "::add-mask::${ECR_PASSWORD}"
          set +e
          OUTPUT="$(DEMO_APP_IMAGE="${DEMO_APP_IMAGE}" \
            DEMO_DOCKER_REGISTRY="${DEMO_DOCKER_REGISTRY}" \
            DEMO_DOCKER_USERNAME="${DEMO_DOCKER_USERNAME}" \
            DEMO_DOCKER_PASSWORD="${ECR_PASSWORD}" \
            DEMO_REUSE_BASELINE_IMAGE=true \
            bash ./infra/aws-upstream-baseline/demo-upsert.sh "${DEMO_NAME}" "${BRANCH_NAME}" 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [[ "$STATUS" -ne 0 ]]; then
            exit "$STATUS"
          fi
          while IFS='=' read -r key value; do
            [[ "$key" == demo_* ]] || continue
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(printf '%s\n' "$OUTPUT" | grep '^demo_' || true)

      - name: Smoke check Rhodes login page
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            code="$(curl -k -s -o /dev/null -w '%{http_code}' "${DEMO_URL}/login" || true)"
            echo "attempt=${attempt} code=${code}"
            if [[ "$code" == "200" || "$code" == "302" || "$code" == "307" ]]; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Workflow summary
        run: |
          echo "Rhodes demo URL: ${DEMO_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ steps.branch.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.image.outputs.uri }}" >> "$GITHUB_STEP_SUMMARY"
