name: Upsert EPC fork preview

on:
  push:
    branches:
      - 'fork/EPC'
  workflow_dispatch:

concurrency:
  group: fork-preview-epc
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upsert preview
        id: preview
        timeout-minutes: 70
        shell: bash
        env:
          PREVIEW_ADMIN_EMAIL: ${{ secrets.EPC_PREVIEW_ADMIN_EMAIL || secrets.SMOKE_TEST_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.EPC_PREVIEW_ADMIN_PASSWORD || secrets.SMOKE_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="$(mktemp)"
          bash ./infra/aws-upstream-baseline/preview-upsert.sh 'fork/EPC' | tee "${OUTPUT_FILE}"
          while IFS='=' read -r key value; do
            [[ -z "$key" ]] && continue
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(grep '^preview_' "${OUTPUT_FILE}")
          rm -f "${OUTPUT_FILE}"

      - name: Smoke test preview
        env:
          BASE_URL: ${{ steps.preview.outputs.preview_url }}
          SMOKE_TEST_EMAIL: ${{ secrets.EPC_PREVIEW_ADMIN_EMAIL || secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.EPC_PREVIEW_ADMIN_PASSWORD || secrets.SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_PATHS: >-
            /backend/projects
            /backend/projects/templates
            /backend/projects/task-templates
            /backend/projects/create
        run: bash ./infra/aws-upstream-baseline/smoke.sh

      - name: Workflow summary
        run: |
          echo "Preview URL: ${{ steps.preview.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: fork/EPC" >> "$GITHUB_STEP_SUMMARY"
          echo "Host: ${{ steps.preview.outputs.preview_hostname }}" >> "$GITHUB_STEP_SUMMARY"
