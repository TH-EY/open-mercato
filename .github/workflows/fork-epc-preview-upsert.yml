name: Upsert EPC fork preview

on:
  push:
    branches:
      - 'fork/EPC'
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: Deployment mode
        required: true
        type: choice
        default: full
        options:
          - full
          - config-restart

concurrency:
  group: om-dokploy-host-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AWS_REGION: eu-west-2
  NAME_PREFIX: openmercato-upstream-baseline-dokploy
  ECR_REPOSITORY_NAME: openmercato-app
  SSM_CLOUDWATCH_LOG_GROUP: /aws/ssm/openmercato-upstream-baseline-dokploy/epc-preview-deploy

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for stale push deploy
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            exit 0
          fi

          remote_sha="$(git ls-remote origin refs/heads/fork/EPC | awk '{print $1}')"
          if [[ -z "${remote_sha}" ]]; then
            echo "::warning::Unable to resolve remote fork/EPC head; continuing deploy."
            exit 0
          fi
          if [[ "${remote_sha}" != "${GITHUB_SHA}" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deploy for ${GITHUB_SHA}; fork/EPC is now ${remote_sha}."
          fi

      - name: Configure AWS credentials
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.freshness.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.freshness.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full')
        uses: docker/setup-buildx-action@v4

      - name: Resolve preview metadata
        if: steps.freshness.outputs.should_deploy == 'true'
        id: preview
        shell: bash
        env:
          BRANCH: fork/EPC
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'full' }}
        run: |
          set -euo pipefail
          source ./infra/aws-upstream-baseline/preview-common.sh

          PREVIEW_SLUG="$(branch_to_preview_slug "${BRANCH}")"
          PREVIEW_HOSTNAME="$(preview_hostname_for_slug "${PREVIEW_SLUG}")"
          PREVIEW_RUNTIME_ENV="$(preview_runtime_env_for_slug "${PREVIEW_SLUG}")"
          TARGET_GROUP_NAME="$(target_group_name_for_slug "${PREVIEW_SLUG}")"
          PREVIEW_PORT="$(choose_preview_port "${PREVIEW_SLUG}" "${TARGET_GROUP_NAME}")"
          PREVIEW_PROJECT="preview-${PREVIEW_SLUG}"
          PREVIEW_URL="https://${PREVIEW_HOSTNAME}"
          REMOTE_WORKDIR="${PREVIEW_REMOTE_ROOT}/${PREVIEW_SLUG}"

          {
            echo "branch=${BRANCH}"
            echo "deploy_mode=${DEPLOY_MODE}"
            echo "preview_slug=${PREVIEW_SLUG}"
            echo "preview_hostname=${PREVIEW_HOSTNAME}"
            echo "preview_runtime_env=${PREVIEW_RUNTIME_ENV}"
            echo "preview_target_group_name=${TARGET_GROUP_NAME}"
            echo "preview_port=${PREVIEW_PORT}"
            echo "preview_project=${PREVIEW_PROJECT}"
            echo "preview_url=${PREVIEW_URL}"
            echo "preview_workdir=${REMOTE_WORKDIR}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve ECR repository
        if: steps.freshness.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full')
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY_URL="$(aws ecr describe-repositories \
            --region "${AWS_REGION}" \
            --repository-names "${ECR_REPOSITORY_NAME}" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          echo "repository_url=${REPOSITORY_URL}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${REPOSITORY_URL}:epc-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        if: steps.freshness.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CONTAINER_PORT=3000
          tags: |
            ${{ steps.ecr.outputs.image_uri }}
            ${{ steps.ecr.outputs.repository_url }}:epc-latest
          cache-from: |
            type=gha,scope=epc-preview-app
            type=registry,ref=${{ steps.ecr.outputs.repository_url }}:epc-buildcache
          cache-to: |
            type=gha,mode=max,scope=epc-preview-app
            type=registry,ref=${{ steps.ecr.outputs.repository_url }}:epc-buildcache,mode=max,oci-mediatypes=true,image-manifest=true

      - name: Prepare SSM logging
        if: steps.freshness.outputs.should_deploy == 'true'
        run: |
          aws logs create-log-group \
            --region "${AWS_REGION}" \
            --log-group-name "${SSM_CLOUDWATCH_LOG_GROUP}" 2>/dev/null || true
          aws logs put-retention-policy \
            --region "${AWS_REGION}" \
            --log-group-name "${SSM_CLOUDWATCH_LOG_GROUP}" \
            --retention-in-days 14 2>/dev/null || true

      - name: Preflight disk and Docker usage
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          SSM_STEP_NAME: EPC preview preflight disk and Docker usage
          SSM_TIMEOUT_SECONDS: 180
        run: |
          bash infra/aws-upstream-baseline/ssm-run-step.sh <<'SSM'
          minimum_available_gb=8
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          available_gb=$((available_kb / 1024 / 1024))

          echo "Root filesystem:"
          df -h /
          echo
          echo "Docker usage:"
          docker system df || true

          if ((available_gb < minimum_available_gb)); then
            echo "Only ${available_gb}GB available on /. Minimum required: ${minimum_available_gb}GB." >&2
            exit 1
          fi
          SSM

      - name: Safe Docker cleanup when disk is low
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          SSM_STEP_NAME: EPC preview safe Docker cleanup
          SSM_TIMEOUT_SECONDS: 600
        run: |
          bash infra/aws-upstream-baseline/ssm-run-step.sh <<'SSM'
          cleanup_threshold_gb=12
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          available_gb=$((available_kb / 1024 / 1024))

          echo "Available before cleanup: ${available_gb}GB"
          if ((available_gb >= cleanup_threshold_gb)); then
            echo "Skipping cleanup; available disk is above ${cleanup_threshold_gb}GB."
            exit 0
          fi

          echo "Pruning unused Docker build cache and unused images. Volumes are left untouched."
          docker builder prune -af || true
          docker image prune -af || true

          echo "Available after cleanup:"
          df -h /
          docker system df || true
          SSM

      - name: Prepare checkout and runtime config
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          PREVIEW_ADMIN_EMAIL: ${{ secrets.EPC_PREVIEW_ADMIN_EMAIL || secrets.SMOKE_TEST_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.EPC_PREVIEW_ADMIN_PASSWORD || secrets.SMOKE_TEST_PASSWORD }}
          SSM_STEP_NAME: EPC preview prepare checkout and runtime config
          SSM_TIMEOUT_SECONDS: 420
        run: |
          openrouter_api_key=""
          if [[ '${{ steps.preview.outputs.preview_hostname }}' == 'preview-epc.om.they.dev' ]]; then
            openrouter_api_key="$(aws secretsmanager get-secret-value \
              --region "${AWS_REGION}" \
              --secret-id "${NAME_PREFIX}/preview-${{ steps.preview.outputs.preview_slug }}/openrouter-api-key" \
              --query SecretString \
              --output text)"
            echo "::add-mask::${openrouter_api_key}"
          fi

          {
            printf 'branch=%q\n' '${{ steps.preview.outputs.branch }}'
            printf 'repo_url=%q\n' 'https://github.com/TH-EY/open-mercato.git'
            printf 'preview_env=%q\n' '${{ steps.preview.outputs.preview_runtime_env }}'
            printf 'preview_hostname=%q\n' '${{ steps.preview.outputs.preview_hostname }}'
            printf 'preview_slug=%q\n' '${{ steps.preview.outputs.preview_slug }}'
            printf 'preview_port=%q\n' '${{ steps.preview.outputs.preview_port }}'
            printf 'preview_project=%q\n' '${{ steps.preview.outputs.preview_project }}'
            printf 'deploy_mode=%q\n' '${{ steps.preview.outputs.deploy_mode }}'
            printf 'app_image=%q\n' '${{ steps.ecr.outputs.image_uri }}'
            printf 'workdir=%q\n' '${{ steps.preview.outputs.preview_workdir }}'
            printf 'openrouter_api_key=%q\n' "${openrouter_api_key}"
            printf 'remote_root=%q\n' '/opt/openmercato-previews'
            printf 'baseline_env_file=%q\n' '/etc/dokploy/compose/baseline-zjkhnl/code/.env'
            printf 'preview_admin_email=%q\n' "${PREVIEW_ADMIN_EMAIL}"
            printf 'preview_admin_password=%q\n' "${PREVIEW_ADMIN_PASSWORD}"
            cat <<'SSM'
          command -v git >/dev/null 2>&1 || { echo "Missing git on preview host" >&2; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "Missing docker on preview host" >&2; exit 1; }

          mkdir -p "$remote_root"
          if [[ ! -d "$workdir/.git" ]]; then
            if [[ "$deploy_mode" == "config-restart" ]]; then
              echo "Config-only deploy requires an existing preview checkout at ${workdir}" >&2
              exit 1
            fi
            git clone --branch "$branch" --single-branch "$repo_url" "$workdir"
          elif [[ "$deploy_mode" == "full" ]]; then
            git -C "$workdir" remote set-url origin "$repo_url"
            git -C "$workdir" fetch origin "$branch" --prune
            git -C "$workdir" checkout -B "$branch" "origin/$branch"
            git -C "$workdir" reset --hard "origin/$branch"
            git -C "$workdir" clean -fdx -e .env
          fi

          python3 - <<'PY' "$baseline_env_file" "$workdir/.env" "$preview_env" "$preview_port" "$preview_hostname" "$preview_admin_email" "$preview_admin_password" "$deploy_mode" "$app_image" "$openrouter_api_key"
          import secrets
          import sys
          from pathlib import Path

          baseline, target, preview_env, preview_port, preview_host, preview_admin_email, preview_admin_password, deploy_mode, app_image, openrouter_api_key = sys.argv[1:11]
          values = {}
          existing = {}
          for line in Path(baseline).read_text().splitlines():
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              values[key] = value
          target_path = Path(target)
          if target_path.exists():
              for line in target_path.read_text().splitlines():
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  existing[key] = value
          values.update({
              'APP_NAME': f'preview-{preview_env}',
              'DEPLOY_ENV': preview_env,
              'APP_PORT': preview_port,
              'APP_URL': f'https://{preview_host}',
              'NEXT_PUBLIC_APP_URL': f'https://{preview_host}',
              'PLATFORM_PORTAL_BASE_URL': f'https://{preview_host}',
              'POSTGRES_PASSWORD': secrets.token_urlsafe(24),
              'JWT_SECRET': secrets.token_urlsafe(48),
              'AUTH_SECRET': secrets.token_urlsafe(48),
              'TENANT_DATA_ENCRYPTION_KEY': secrets.token_urlsafe(48),
              'MEILISEARCH_MASTER_KEY': secrets.token_urlsafe(32),
          })
          platform_domains = [
              domain.strip()
              for domain in (values.get('PLATFORM_DOMAINS') or 'localhost,openmercato.com').split(',')
              if domain.strip()
          ]
          if preview_host.lower() not in {domain.lower() for domain in platform_domains}:
              platform_domains.append(preview_host)
          values['PLATFORM_DOMAINS'] = ','.join(platform_domains)
          for key in [
              'POSTGRES_PASSWORD',
              'JWT_SECRET',
              'AUTH_SECRET',
              'TENANT_DATA_ENCRYPTION_KEY',
              'MEILISEARCH_MASTER_KEY',
              'APP_IMAGE',
              'EPC_LEAD_TENANT_ID',
              'EPC_LEAD_ORGANIZATION_ID',
              'EPC_LEAD_OWNER_USER_ID',
              'EPC_LEAD_PIPELINE_STAGE_ID',
              'EPC_LEAD_CAPTURE_ALLOWED_ORIGINS',
              'OPENROUTER_API_KEY',
              'OPENROUTER_BASE_URL',
              'OM_AI_CUSTOMERS_PROVIDER',
              'OM_AI_CUSTOMERS_MODEL',
              'OM_AI_CATALOG_PROVIDER',
              'OM_AI_CATALOG_MODEL',
          ]:
              if existing.get(key):
                  values[key] = existing[key]
          if preview_host == 'preview-epc.om.they.dev':
              values.update({
                  'SELF_SERVICE_ONBOARDING_ENABLED': 'false',
                  'SYSTEM_EMAIL_PROVIDER': 'ses',
                  'AWS_SES_REGION': values.get('AWS_SES_REGION') or values.get('AWS_REGION') or 'eu-west-2',
                  'EMAIL_FROM': values.get('EMAIL_FROM') or 'no-reply@they.dev',
                  'NOTIFICATIONS_EMAIL_FROM': values.get('NOTIFICATIONS_EMAIL_FROM') or values.get('EMAIL_FROM') or 'no-reply@they.dev',
                  'EPC_LEAD_CAPTURE_ALLOWED_ORIGINS': values.get('EPC_LEAD_CAPTURE_ALLOWED_ORIGINS') or f'https://{preview_host}',
                  'OM_AI_CUSTOMERS_PROVIDER': 'openrouter',
                  'OM_AI_CUSTOMERS_MODEL': 'meta-llama/llama-3.3-70b-instruct',
                  'OM_AI_CATALOG_PROVIDER': 'openrouter',
                  'OM_AI_CATALOG_MODEL': 'meta-llama/llama-3.3-70b-instruct',
              })
              if openrouter_api_key:
                  values['OPENROUTER_API_KEY'] = openrouter_api_key
          if app_image:
              values['APP_IMAGE'] = app_image
          if preview_admin_email:
              values['OM_INIT_SUPERADMIN_EMAIL'] = preview_admin_email
              values['ADMIN_EMAIL'] = preview_admin_email
          if preview_admin_password:
              values['OM_INIT_SUPERADMIN_PASSWORD'] = preview_admin_password
          keys = [
              'APP_NAME','DEPLOY_ENV','APP_PORT','APP_URL','NEXT_PUBLIC_APP_URL',
              'APP_IMAGE',
              'PLATFORM_PORTAL_BASE_URL','PLATFORM_DOMAINS','POSTGRES_USER','POSTGRES_PASSWORD','POSTGRES_DB',
              'JWT_SECRET','AUTH_SECRET','TENANT_DATA_ENCRYPTION_KEY','MEILISEARCH_MASTER_KEY',
              'SELF_SERVICE_ONBOARDING_ENABLED','DEMO_MODE','ADMIN_EMAIL','OM_INIT_SUPERADMIN_EMAIL',
              'OM_INIT_SUPERADMIN_PASSWORD','OPENAI_API_KEY','SYSTEM_EMAIL_PROVIDER','AWS_SES_REGION',
              'AWS_SES_CONFIGURATION_SET','RESEND_API_KEY','EMAIL_FROM','NOTIFICATIONS_EMAIL_FROM',
              'OPENROUTER_API_KEY','OPENROUTER_BASE_URL',
              'OM_AI_CUSTOMERS_PROVIDER','OM_AI_CUSTOMERS_MODEL',
              'OM_AI_CATALOG_PROVIDER','OM_AI_CATALOG_MODEL',
              'EPC_LEAD_TENANT_ID','EPC_LEAD_ORGANIZATION_ID','EPC_LEAD_OWNER_USER_ID',
              'EPC_LEAD_PIPELINE_STAGE_ID','EPC_LEAD_CAPTURE_ALLOWED_ORIGINS'
          ]
          target_path.write_text('\n'.join(f'{key}={values[key]}' for key in keys if key in values) + '\n')
          PY

          cd "$workdir"
          set -a
          . ./.env
          set +a

          if [[ "$preview_hostname" == "preview-epc.om.they.dev" && ( -z "${EPC_LEAD_TENANT_ID:-}" || -z "${EPC_LEAD_ORGANIZATION_ID:-}" ) ]]; then
            compose() {
              COMPOSE_BAKE=false COMPOSE_DOCKER_CLI_BUILD=0 DOCKER_BUILDKIT=0 docker compose --project-name "$preview_project" --env-file .env -f docker-compose.fullapp.yml "$@"
            }
            postgres_container="$(compose ps -q postgres 2>/dev/null || true)"
            if [[ -z "$postgres_container" ]]; then
              echo "Unable to derive EPC lead capture scope: preview postgres container is not running." >&2
              exit 1
            fi
            scope_line="$(docker exec -e PGPASSWORD="${POSTGRES_PASSWORD:-}" "$postgres_container" psql -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-open-mercato}" -At -F $'\t' -c "select tenant_id::text, id::text from organizations where deleted_at is null and is_active = true order by created_at asc limit 1;" | head -n 1)"
            if [[ -z "$scope_line" ]]; then
              echo "Unable to derive EPC lead capture scope: no active organization found." >&2
              exit 1
            fi
            IFS=$'\t' read -r epc_lead_tenant_id epc_lead_organization_id <<< "$scope_line"
            python3 - <<'PY' "$workdir/.env" "$epc_lead_tenant_id" "$epc_lead_organization_id"
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          updates = {
              'EPC_LEAD_TENANT_ID': sys.argv[2],
              'EPC_LEAD_ORGANIZATION_ID': sys.argv[3],
          }
          values = {}
          order = []
          for line in path.read_text().splitlines():
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              if key not in values:
                  order.append(key)
              values[key] = value
          for key, value in updates.items():
              if key not in values:
                  order.append(key)
              values[key] = value
          path.write_text('\n'.join(f'{key}={values[key]}' for key in order if key in values) + '\n')
          PY
            set -a
            . ./.env
            set +a
            echo "Derived EPC lead capture scope from preview organization ${EPC_LEAD_ORGANIZATION_ID}."
          fi
          echo "Prepared preview checkout:"
          git rev-parse HEAD
          echo "Branch: ${branch}"
          echo "Deploy mode: ${deploy_mode}"
          echo "App image: ${APP_IMAGE:-open-mercato/app:${preview_env}}"
          echo "Port: ${APP_PORT}"
          SSM
          } | bash infra/aws-upstream-baseline/ssm-run-step.sh

      - name: Pull or verify app image
        if: steps.freshness.outputs.should_deploy == 'true'
        timeout-minutes: 25
        env:
          SSM_STEP_NAME: EPC preview pull or verify app image
          SSM_TIMEOUT_SECONDS: 1500
        run: |
          ecr_registry=''
          ecr_password=''
          if [[ '${{ steps.preview.outputs.deploy_mode }}' != 'config-restart' ]]; then
            ecr_registry='${{ steps.ecr.outputs.repository_url }}'
            ecr_registry="${ecr_registry%%/*}"
            ecr_password="$(aws ecr get-login-password --region "${AWS_REGION}")"
          fi

          {
            printf 'deploy_mode=%q\n' '${{ steps.preview.outputs.deploy_mode }}'
            printf 'preview_env=%q\n' '${{ steps.preview.outputs.preview_runtime_env }}'
            printf 'workdir=%q\n' '${{ steps.preview.outputs.preview_workdir }}'
            printf 'ecr_registry=%q\n' "${ecr_registry}"
            printf 'ecr_password=%q\n' "${ecr_password}"
            cat <<'SSM'
          cd "$workdir"
          set -a
          . ./.env
          set +a
          app_image="${APP_IMAGE:-open-mercato/app:$preview_env}"

          if [[ "$deploy_mode" == "config-restart" ]]; then
            echo "Config restart requested; verifying existing app image instead of building."
            docker image inspect "$app_image" --format '{{.Id}} {{.Created}}'
            exit 0
          fi

          if [[ -z "${ecr_registry}" || -z "${ecr_password}" ]]; then
            echo "Missing ECR registry or login token for full deploy." >&2
            exit 1
          fi
          printf '%s' "${ecr_password}" | docker login --username AWS --password-stdin "${ecr_registry}" >/dev/null
          unset ecr_password
          cleanup_ecr_login() {
            docker logout "${ecr_registry}" >/dev/null 2>&1 || true
          }
          trap cleanup_ecr_login EXIT

          echo "Pulling prebuilt app image while the current app container stays online: ${app_image}"
          timeout 900 docker pull "$app_image"
          echo "Pulled image:"
          docker image inspect "$app_image" --format '{{.Id}} {{.RepoTags}} {{.Created}}'
          SSM
          } | bash infra/aws-upstream-baseline/ssm-run-step.sh

      - name: Recreate app without touching volumes
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          SSM_STEP_NAME: EPC preview recreate app
          SSM_TIMEOUT_SECONDS: 900
        run: |
          {
            printf 'preview_project=%q\n' '${{ steps.preview.outputs.preview_project }}'
            printf 'workdir=%q\n' '${{ steps.preview.outputs.preview_workdir }}'
            cat <<'SSM'
          cd "$workdir"
          set -a
          . ./.env
          set +a

          compose() {
            COMPOSE_BAKE=false COMPOSE_DOCKER_CLI_BUILD=0 DOCKER_BUILDKIT=0 docker compose --project-name "$preview_project" --env-file .env -f docker-compose.fullapp.yml "$@"
          }

          existing_epc_postgres="$(compose ps -q postgres 2>/dev/null || true)"
          if [[ -n "$existing_epc_postgres" && -n "${POSTGRES_PASSWORD:-}" ]]; then
            pg_password_sql="/tmp/openmercato-preview-${DEPLOY_ENV}-postgres-password.sql"
            python3 - <<'PY' > "$pg_password_sql"
          import os

          password = os.environ["POSTGRES_PASSWORD"]
          escaped = password.replace("'", "''")
          print("set password_encryption = 'scram-sha-256';")
          print(f"alter role postgres login password '{escaped}';")
          PY
            docker cp "$pg_password_sql" "$existing_epc_postgres:/tmp/openmercato-preview-postgres-password.sql"
            rm -f "$pg_password_sql"
            for attempt in 1 2 3 4 5; do
              if docker exec "$existing_epc_postgres" psql -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-postgres}" -v ON_ERROR_STOP=1 -f /tmp/openmercato-preview-postgres-password.sql >/dev/null; then
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                exit 1
              fi
              echo "Postgres password sync attempt ${attempt} failed; retrying"
              sleep "$((attempt * 2))"
            done
            docker exec "$existing_epc_postgres" rm -f /tmp/openmercato-preview-postgres-password.sql
          fi

          compose up -d --no-deps --no-build --force-recreate app
          compose ps app
          SSM
          } | bash infra/aws-upstream-baseline/ssm-run-step.sh

      - name: Local /login healthcheck
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          SSM_STEP_NAME: EPC preview local login healthcheck
          SSM_TIMEOUT_SECONDS: 300
        run: |
          {
            printf 'workdir=%q\n' '${{ steps.preview.outputs.preview_workdir }}'
            cat <<'SSM'
          cd "$workdir"
          set -a
          . ./.env
          set +a
          url="http://127.0.0.1:${APP_PORT:-3000}/login"

          for attempt in $(seq 1 40); do
            status="$(curl -fsS -o /tmp/openmercato-preview-login.html -w '%{http_code}' "$url" 2>/dev/null || true)"
            if [[ "$status" =~ ^[23] ]]; then
              echo "Local preview login endpoint is reachable: ${url} (${status})"
              exit 0
            fi
            echo "Waiting for local preview login endpoint (${attempt}/40): ${status:-no response}"
            sleep 5
          done

          cat /tmp/openmercato-preview-login.html 2>/dev/null || true
          echo "Preview app did not become reachable at ${url}" >&2
          exit 1
          SSM
          } | bash infra/aws-upstream-baseline/ssm-run-step.sh

      - name: Post-deploy Docker cleanup
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          SSM_STEP_NAME: EPC preview post-deploy Docker cleanup
          SSM_TIMEOUT_SECONDS: 600
        run: |
          bash infra/aws-upstream-baseline/ssm-run-step.sh <<'SSM'
          echo "Post-deploy cleanup; app is already running:"
          df -h /
          timeout 30s docker system df || echo "docker system df skipped, failed, or timed out"
          timeout 6m docker builder prune -af || echo "docker builder prune skipped, failed, or timed out"
          timeout 3m docker image prune -f || echo "docker image prune skipped, failed, or timed out"
          echo "Post-deploy cleanup complete:"
          df -h /
          timeout 30s docker system df || echo "docker system df skipped, failed, or timed out"
          SSM

      - name: Upsert ALB routing
        if: steps.freshness.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source ./infra/aws-upstream-baseline/preview-common.sh

          PREVIEW_HOSTNAME='${{ steps.preview.outputs.preview_hostname }}'
          PREVIEW_PORT='${{ steps.preview.outputs.preview_port }}'
          TARGET_GROUP_NAME='${{ steps.preview.outputs.preview_target_group_name }}'
          PREVIEW_URL='${{ steps.preview.outputs.preview_url }}'

          TARGET_GROUP_ARN="$(aws elbv2 describe-target-groups --region "${AWS_REGION}" --names "${TARGET_GROUP_NAME}" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)"
          if [[ -z "${TARGET_GROUP_ARN}" || "${TARGET_GROUP_ARN}" == "None" ]]; then
            TARGET_GROUP_ARN="$(aws elbv2 create-target-group \
              --region "${AWS_REGION}" \
              --name "${TARGET_GROUP_NAME}" \
              --protocol HTTP \
              --port "${PREVIEW_PORT}" \
              --vpc-id "${VPC_ID}" \
              --target-type instance \
              --health-check-protocol HTTP \
              --health-check-port "${PREVIEW_PORT}" \
              --health-check-path /login \
              --health-check-interval-seconds 15 \
              --health-check-timeout-seconds 10 \
              --healthy-threshold-count 2 \
              --unhealthy-threshold-count 2 \
              --matcher HttpCode=200-399 \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text)"
          fi

          aws elbv2 register-targets --region "${AWS_REGION}" --target-group-arn "${TARGET_GROUP_ARN}" --targets "Id=${PREVIEW_INSTANCE_ID},Port=${PREVIEW_PORT}" >/dev/null

          RULE_ARN="$(existing_rule_arn_for_host "${PREVIEW_HOSTNAME}")"
          if [[ -z "${RULE_ARN}" ]]; then
            PRIORITY="$(choose_rule_priority)"
            RULE_ARN="$(aws elbv2 create-rule \
              --region "${AWS_REGION}" \
              --listener-arn "${LISTENER_ARN}" \
              --priority "${PRIORITY}" \
              --conditions "[{\"Field\":\"host-header\",\"HostHeaderConfig\":{\"Values\":[\"${PREVIEW_HOSTNAME}\"]}}]" \
              --actions "[{\"Type\":\"forward\",\"TargetGroupArn\":\"${TARGET_GROUP_ARN}\"}]" \
              --query 'Rules[0].RuleArn' \
              --output text)"
          else
            aws elbv2 modify-rule \
              --region "${AWS_REGION}" \
              --rule-arn "${RULE_ARN}" \
              --conditions "[{\"Field\":\"host-header\",\"HostHeaderConfig\":{\"Values\":[\"${PREVIEW_HOSTNAME}\"]}}]" \
              --actions "[{\"Type\":\"forward\",\"TargetGroupArn\":\"${TARGET_GROUP_ARN}\"}]" >/dev/null
          fi

          wait_for_target_healthy "${TARGET_GROUP_ARN}" 90
          wait_for_http_200 "${PREVIEW_URL}/login" 90

          echo "preview_target_group_arn=${TARGET_GROUP_ARN}" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        id: smoke
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          BASE_URL: ${{ steps.preview.outputs.preview_url }}
          SMOKE_TEST_EMAIL: ${{ secrets.EPC_PREVIEW_ADMIN_EMAIL || secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.EPC_PREVIEW_ADMIN_PASSWORD || secrets.SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_PATHS: >-
            /backend/projects
            /backend/projects/templates
            /backend/projects/task-templates
            /backend/projects/create
        run: |
          started_seconds="${SECONDS}"
          bash ./infra/aws-upstream-baseline/smoke.sh
          elapsed_seconds=$((SECONDS - started_seconds))
          echo "elapsed_seconds=${elapsed_seconds}" >> "$GITHUB_OUTPUT"
          echo "Smoke test completed in ${elapsed_seconds}s"

      - name: Diagnostics
        if: always() && steps.freshness.outputs.should_deploy == 'true'
        env:
          SSM_STEP_NAME: EPC preview diagnostics
          SSM_TIMEOUT_SECONDS: 300
        run: |
          {
            printf 'preview_project=%q\n' '${{ steps.preview.outputs.preview_project }}'
            printf 'workdir=%q\n' '${{ steps.preview.outputs.preview_workdir }}'
            cat <<'SSM'
          cd "$workdir" 2>/dev/null || true
          echo "Disk:"
          df -h / || true
          echo
          echo "Docker usage:"
          docker system df || true
          echo
          echo "Containers:"
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E "mercato-|${preview_project}" || docker ps || true
          echo
          if [[ -f .env ]]; then
            set -a
            . ./.env
            set +a
            app_image="${APP_IMAGE:-open-mercato/app:${DEPLOY_ENV:-local}}"
            echo "Current app image:"
            docker image inspect "$app_image" --format '{{.Id}} {{.RepoTags}} {{.Created}}' || true
          fi
          echo
          echo "App logs:"
          docker compose --project-name "$preview_project" --env-file .env -f docker-compose.fullapp.yml logs --tail=120 app || true
          SSM
          } | bash infra/aws-upstream-baseline/ssm-run-step.sh

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "### EPC preview deploy"
            echo "- Preview URL: ${{ steps.preview.outputs.preview_url }}"
            echo "- Branch: \`${{ steps.preview.outputs.branch }}\`"
            echo "- Deploy mode: \`${{ steps.preview.outputs.deploy_mode }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`${{ steps.ecr.outputs.image_uri || 'unchanged config-restart image' }}\`"
            echo "- Build cache: GitHub Actions cache \`epc-preview-app\` + ECR registry cache \`${{ steps.ecr.outputs.repository_url || 'n/a' }}:epc-buildcache\`"
            echo "- Host: \`${{ steps.preview.outputs.preview_hostname }}\`"
            echo "- Port: \`${{ steps.preview.outputs.preview_port }}\`"
            echo "- Smoke test: \`${{ steps.smoke.outputs.elapsed_seconds || 'not-run' }}s\`"
            echo "- SSM logs: \`${SSM_CLOUDWATCH_LOG_GROUP}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
