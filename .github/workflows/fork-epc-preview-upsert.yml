name: Upsert EPC fork preview

on:
  push:
    branches:
      - 'fork/EPC'
  workflow_dispatch:

concurrency:
  group: fork-preview-epc
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Preflight disk cleanup
        shell: bash
        run: |
          set -euo pipefail
          source ./infra/aws-upstream-baseline/preview-common.sh

          REMOTE_SCRIPT="$(mktemp)"
          cat > "${REMOTE_SCRIPT}" <<'SCRIPT'
          bash <<'BASH'
          set -euo pipefail
          echo "Before cleanup:"
          df -h /
          docker system df || true

          docker builder prune -af || true
          docker image prune -f || true

          echo "After cleanup:"
          df -h /
          docker system df || true
          BASH
          SCRIPT

          COMMANDS_JSON="$(python3 - <<'PY' "${REMOTE_SCRIPT}"
          import json, sys
          path = sys.argv[1]
          print(json.dumps({'commands': [open(path, 'r', encoding='utf-8').read()]}))
          PY
          )"
          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${PREVIEW_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "${COMMANDS_JSON}" \
            --query 'Command.CommandId' \
            --output text)"
          if ! aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PREVIEW_INSTANCE_ID}"; then
            true
          fi

          STATUS="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PREVIEW_INSTANCE_ID}" \
            --query 'Status' \
            --output text)"
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PREVIEW_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text
          if [[ "${STATUS}" != "Success" ]]; then
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${PREVIEW_INSTANCE_ID}" \
              --query 'StandardErrorContent' \
              --output text >&2
            exit 1
          fi

          rm -f "${REMOTE_SCRIPT}"

      - name: Upsert preview
        id: preview
        timeout-minutes: 70
        shell: bash
        env:
          PREVIEW_ADMIN_EMAIL: ${{ secrets.EPC_PREVIEW_ADMIN_EMAIL || secrets.SMOKE_TEST_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.EPC_PREVIEW_ADMIN_PASSWORD || secrets.SMOKE_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="$(mktemp)"
          bash ./infra/aws-upstream-baseline/preview-upsert.sh 'fork/EPC' | tee "${OUTPUT_FILE}"
          while IFS='=' read -r key value; do
            [[ -z "$key" ]] && continue
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(grep '^preview_' "${OUTPUT_FILE}")
          rm -f "${OUTPUT_FILE}"

      - name: Smoke test preview
        env:
          BASE_URL: ${{ steps.preview.outputs.preview_url }}
          SMOKE_TEST_EMAIL: ${{ secrets.EPC_PREVIEW_ADMIN_EMAIL || secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.EPC_PREVIEW_ADMIN_PASSWORD || secrets.SMOKE_TEST_PASSWORD }}
        run: bash ./infra/aws-upstream-baseline/smoke.sh

      - name: Workflow summary
        run: |
          echo "Preview URL: ${{ steps.preview.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: fork/EPC" >> "$GITHUB_STEP_SUMMARY"
          echo "Host: ${{ steps.preview.outputs.preview_hostname }}" >> "$GITHUB_STEP_SUMMARY"
