services:
  app:
    image: ${APP_IMAGE}
    container_name: openmercato-crm-app
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        INIT_COMMAND='yarn mercato init' sh /app/docker/scripts/init-or-migrate.sh
        yarn start
    working_dir: /app/apps/mercato
    ports:
      - "${APP_PORT:-3001}:${CONTAINER_PORT:-3000}"
    volumes:
      - crm_init_marker:/tmp/init-marker
      - crm_attachments_storage:/app/apps/mercato/storage
    environment:
      NODE_ENV: production
      DEPLOY_ENV: crm-they-dev
      PORT: ${CONTAINER_PORT:-3000}
      APP_URL: ${APP_URL:-https://crm.they.dev}
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      DB_POOL_MIN: ${WEB_DB_POOL_MIN:-0}
      DB_POOL_MAX: ${WEB_DB_POOL_MAX:-4}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-30000}
      DB_POOL_ACQUIRE_TIMEOUT: ${DB_POOL_ACQUIRE_TIMEOUT:-30000}
      CACHE_STRATEGY: redis
      CACHE_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      QUEUE_STRATEGY: async
      QUEUE_REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY}
      TENANT_DATA_ENCRYPTION: "true"
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SELF_SERVICE_ONBOARDING_ENABLED: "false"
      DEMO_MODE: "false"
      AUTO_SPAWN_WORKERS: "false"
      AUTO_SPAWN_SCHEDULER: "false"
      DATA_SYNC_QUEUE_CONCURRENCY: ${DATA_SYNC_QUEUE_CONCURRENCY:-1}
      QUERY_INDEX_COVERAGE_WARMUP_ON_LOGIN: "false"
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL}
      OM_INIT_SUPERADMIN_PASSWORD: ${OM_INIT_SUPERADMIN_PASSWORD}
      ADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL}
      NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED: "false"
      UPGRADE_ACTIONS_ENABLED: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
      OM_AI_CUSTOMERS_PROVIDER: ${OM_AI_CUSTOMERS_PROVIDER:-}
      OM_AI_CUSTOMERS_MODEL: ${OM_AI_CUSTOMERS_MODEL:-}
      OM_AI_CATALOG_PROVIDER: ${OM_AI_CATALOG_PROVIDER:-}
      OM_AI_CATALOG_MODEL: ${OM_AI_CATALOG_MODEL:-}
      OPENCODE_URL: ${OPENCODE_URL:-http://opencode:4096}
      MCP_URL: ${MCP_URL:-http://mcp:3001}
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${CONTAINER_PORT:-3000}/login').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - crm_network

  opencode:
    build:
      context: ./docker/opencode
    image: opencode-mvp
    container_name: mercato-crm-opencode
    restart: unless-stopped
    environment:
      # Unified AI provider/model selection. OM_AI_* wins; OPENCODE_* stays
      # as a BC fallback resolved by the opencode entrypoint script.
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # In-network MCP wiring. MCP_SERVER_API_KEY (env) wins when set; the
      # file fallback reads the key the mcp service provisioned into the
      # shared volume after waiting for the MCP /health endpoint.
      OPENCODE_MCP_URL: ${OPENCODE_MCP_URL:-http://mcp:3001/mcp}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
    volumes:
      - crm_mcp_shared:/run/mcp-shared:ro
    depends_on:
      mcp:
        condition: service_started
    # Visibility only (compose ps / smoke tests): the entrypoint owns the
    # wait-for-MCP-and-key sequencing.
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:4096/global/health" ]
      interval: 30s
      timeout: 6s
      retries: 20
      start_period: 900s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - crm_network

  mcp:
    image: ${APP_IMAGE}
    container_name: openmercato-crm-mcp
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/mcp-entrypoint.sh ]; then
          echo "ERROR: mcp-entrypoint.sh not found. Please rebuild the container: docker compose build --no-cache app"
          exit 1
        fi
        sh /app/docker/scripts/mcp-entrypoint.sh
    volumes:
      - crm_mcp_shared:/run/mcp-shared
    environment:
      NODE_ENV: development
      NODE_OPTIONS: ${MCP_NODE_OPTIONS:---max-old-space-size=2048}
      DEPLOY_ENV: crm-they-dev
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      DATABASE_URL: ${DATABASE_URL}
      CACHE_REDIS_URL: redis://redis:6379
      CACHE_STRATEGY: redis
      AUTO_SPAWN_WORKERS: "false"
      AUTO_SPAWN_SCHEDULER: "false"
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET:-JWT}
      # Code Mode api.request() must call back into the app over service DNS.
      # NEXT_PUBLIC_* are pinned so a stray .env cannot hijack the base URL.
      APP_URL: http://app:${CONTAINER_PORT:-3000}
      NEXT_PUBLIC_APP_URL: http://app:${CONTAINER_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: ""
      # Session-token (tier 2) decryption requires the app's encryption config.
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MCP_PORT: "3001"
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
      MCP_WAIT_FOR_APP_TIMEOUT: ${MCP_WAIT_FOR_APP_TIMEOUT:-1800}
      MCP_DEBUG: ${MCP_DEBUG:-false}
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      app:
        condition: service_started
    # Visibility only (compose ps / smoke tests): startup ordering is owned by
    # the entrypoint wait loops, not by this healthcheck.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 900s
    networks:
      - crm_network


  worker:
    image: ${APP_IMAGE}
    container_name: openmercato-crm-worker
    restart: unless-stopped
    user: "0"
    command:
      - sh
      - -c
      - yarn mercato queue worker --all
    working_dir: /app/apps/mercato
    environment:
      NODE_ENV: production
      DEPLOY_ENV: crm-they-dev
      APP_URL: ${APP_URL:-https://crm.they.dev}
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      DB_POOL_MIN: ${WORKER_DB_POOL_MIN:-0}
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-30000}
      DB_POOL_ACQUIRE_TIMEOUT: ${DB_POOL_ACQUIRE_TIMEOUT:-30000}
      CACHE_STRATEGY: redis
      CACHE_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      QUEUE_STRATEGY: async
      QUEUE_REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY}
      TENANT_DATA_ENCRYPTION: "true"
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SELF_SERVICE_ONBOARDING_ENABLED: "false"
      DEMO_MODE: "false"
      DATA_SYNC_QUEUE_CONCURRENCY: ${DATA_SYNC_QUEUE_CONCURRENCY:-1}
      QUERY_INDEX_COVERAGE_WARMUP_ON_LOGIN: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
      OM_AI_CUSTOMERS_PROVIDER: ${OM_AI_CUSTOMERS_PROVIDER:-}
      OM_AI_CUSTOMERS_MODEL: ${OM_AI_CUSTOMERS_MODEL:-}
      OM_AI_CATALOG_PROVIDER: ${OM_AI_CATALOG_PROVIDER:-}
      OM_AI_CATALOG_MODEL: ${OM_AI_CATALOG_MODEL:-}
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: openmercato-crm-redis
    restart: unless-stopped
    volumes:
      - crm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: openmercato-crm-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - crm_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

volumes:
  crm_init_marker:
  crm_attachments_storage:
  crm_redis_data:
  crm_meilisearch_data:
  crm_mcp_shared:


networks:
  crm_network:
    driver: bridge
